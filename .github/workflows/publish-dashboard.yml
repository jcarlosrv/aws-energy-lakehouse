name: publish-dashboard

on:
  schedule:
    - cron: "0 8 * * MON"        
  workflow_dispatch:             
    inputs:
      dry_run:
        description: "Download and validate only; do not commit"
        type: boolean
        default: true            

permissions:
  id-token: write                
  contents: write             

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4      

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}  
          aws-region: us-east-1

      - name: Download payload
        run: aws s3api get-object --bucket jcarlosrv-energy-lakehouse --key dashboard/latest.json latest.json

      - name: Validate payload
        run: python .github/scripts/validate_payload.py latest.json

      - name: Commit if changed
        if: github.event_name == 'schedule' || inputs.dry_run == false
        run: |
          mkdir -p docs/data
          mv latest.json docs/data/latest.json
          git add docs/data/latest.json
          if git diff --cached --quiet -- docs/data/latest.json; then
            echo "payload unchanged; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "update dashboard data"
          git push